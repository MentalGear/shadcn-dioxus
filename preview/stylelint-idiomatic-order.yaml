# Lifted from stylelint-config-idiomatic-order 10.0.0 (lifted-from: stylelint-config-idiomatic-order@10.0.0).
# Its index.js built this property order from helper functions (trbl, minMax, border); the list below is the
# flat list that those functions produced, so the package is no longer a dependency. stylelint-order stays a
# dev dependency. Recorded in dev-docs/supply-chain/README.md. The licence of the lifted code:
