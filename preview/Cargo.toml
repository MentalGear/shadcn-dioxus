[package]
name = "preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
dioxus-code = { version = "0.1.0", default-features = false, features = ["macro", "lang-css"] }
dioxus-icons = "0.1.0"
# The two optional primitives features gate `palette` / `time` for every other consumer; the docs site demos both.
dioxus-primitives = { workspace = true, features = ["calendar", "color-picker"] }
dioxus-i18n = "0.6.0"
palette = "0.7.6"
unic-langid = { version = "0.9", features = ["macros"] }
tracing = { workspace = true }
time = { version = "0.3.44", features = ["std", "macros"] }
# The `markdown` component's parser. Exact pin, no default features and no `html`: the component renders
# parser events into its own allowlisted tree (scripts/check-markdown-parser.sh).
pulldown-cmark = { version = "=0.13.4", default-features = false }


[build-dependencies]
dioxus = { workspace = true }
dioxus-code = { version = "0.1.0", default-features = false, features = ["runtime", "lang-css"] }
dioxus-ssr = "0.7.0"
# docs.md -> HTML in build.rs only (no CLI `getopts`); >= 0.13.4 carries the tight-paragraph panic fix.
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde_json = "1"

[dev-dependencies]
dioxus-ssr = "0.7.0"
# `ssr_parity.rs` drives a native VirtualDom whose tasks may hold a tokio timer (primitives `src/sleep.rs`).
tokio = { version = "1", features = ["rt", "time"] }
serde_json = "1"

[features]
web = ["dioxus/web", "dioxus-primitives/web"]
desktop = ["dioxus/desktop", "dioxus-primitives/web"]
fullstack = ["dioxus/fullstack"]
server = ["dioxus/server", "dioxus/fullstack", "dioxus-primitives/web"]
native = ["dioxus/native"]
