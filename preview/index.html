    <!-- Same-page anchors over `content-visibility: auto` cards (main.css `--dx-cv`; dev-docs/research/
         scroll-jank-2026-10-04.md section 8). A card that has not been rendered yet is laid out at its size
         ESTIMATE and resizes when it is rendered, so a `#fragment` scroll over such cards was computed against
         geometry that is about to change and landed up to ~1,200 px off. This switches every card to
         `content-visibility: visible` (`html[data-cv-settle]`) BEFORE the scroll offset is computed, then
         releases it ~300 ms after the last scroll event (4 s at most), by which time each card has recorded its
         true height for `contain-intrinsic-size: auto`. Three entry points, all fragment navigations:
           * a click on a same-page `a[href^="#"]`: capture phase, so the layout is final before the browser's own
             scroll runs; it is left to do the scrolling, and animates it because this handler opts that one jump in
             (`html[data-anchor-scroll] { scroll-behavior: smooth }`, main.css; smooth is never ambient);
           * a fresh load of `<page>#id`: set from the first layout, so the browser's load-time fragment scroll of
             the static HTML is exact; and, because a client-rendered page has no target yet when the browser looks
             for it, scrolls there itself once the element exists;
           * Back/Forward to a hash (`hashchange`): the router sets `history.scrollRestoration = "manual"`, so the
             browser scrolls nowhere; scrolls there itself, as a fragment navigation would.
         Our own scrolls are instant, aimed with `scrollIntoView` (which honours `html`'s `scroll-padding-top`)
         and re-aimed for up to 1 s while the layout settles; any wheel/touch/key/pointer input ends that. -->
    <script>
(function () {
  var R = document.documentElement, ATTR = 'data-cv-settle', SMOOTH = 'data-anchor-scroll';
  var held = false, timer = 0, t0 = 0, last = 0, skip = '', skipAt = 0, quit = null;

  function id(h) { try { return decodeURIComponent((h || '').replace(/^#/, '')); } catch (e) { return ''; } }
  function el(n) { return n ? document.getElementById(n) : null; }

  function bump() { last = performance.now(); }
  function arm() {
    if (held) return;
    /* listener-ok: removed by release() below, which tick() reaches within 4 s of every arm() */
    held = true; R.setAttribute(ATTR, ''); addEventListener('scroll', bump, { passive: true });
  }
  function release() {
    clearTimeout(timer); held = false; R.removeAttribute(ATTR); R.removeAttribute(SMOOTH); removeEventListener('scroll', bump);
  }
  function tick() {
    var now = performance.now();
    if (now - t0 < 4000 && (now - t0 < 500 || now - last < 300)) { timer = setTimeout(tick, 100); return; }
    release();
  }
  /* Render every card for real and lay it out NOW; keep doing so until the page has stopped scrolling. */
  function settle(t) {
    arm(); t0 = last = performance.now();
    clearTimeout(timer); timer = setTimeout(tick, 100);
    void t.offsetTop;
  }

  /* Our own scroll (load, Back/Forward): aim, then re-aim while late layout (fonts, hydration) moves the target. */
  function aim(t) {
    if (quit) quit();
    var pad = parseFloat(getComputedStyle(R).scrollPaddingTop) || 0, until = performance.now() + 1000, calm = 0, done = false;
    var ev = ['wheel', 'touchstart', 'keydown', 'pointerdown'], opt = { passive: true, capture: true };
    quit = function () { done = true; ev.forEach(function (e) { removeEventListener(e, quit, opt); }); quit = null; };
    /* listener-ok: removed by quit() above, which any input, the 1 s budget or a newer aim() runs */
    ev.forEach(function (e) { addEventListener(e, quit, opt); });
    t.scrollIntoView({ block: 'start', behavior: 'instant' });
    (function frame() {
      if (done) return;
      if (performance.now() > until || calm >= 3) return quit();
      if (Math.abs(t.getBoundingClientRect().top - pad) > 1) { calm = 0; t.scrollIntoView({ block: 'start', behavior: 'instant' }); } else calm++;
      requestAnimationFrame(frame);

  /* listener-ok: page-lifetime by design -- one delegated capture click listener for same-page anchors,
     installed once while the document head is parsed, before any component exists to own it */
  addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href^="#"]');
    /* A placeholder link (`href="#"`: the demos' stand-in for a destination) goes nowhere. Left alone it
       appends `#` to the URL and scrolls the page to the top. Cancelled HERE, not in a Rust handler, so the
       class is closed for every demo that has one or ever will, on a prerendered page before the wasm bundle
       has hydrated it as well as after, and in a block-demo iframe (same document shell). Propagation is not
       stopped, so a demo's own `onclick` still runs. (`oracle/tier2-html/demo-placeholder-links.spec.ts`) */
    if (a && a.getAttribute('href') === '#') { e.preventDefault(); return; }
    /* Smooth scrolling is opt-in (main.css `html[data-anchor-scroll]`): any click that is not a same-page anchor

    R.removeAttribute(SMOOTH);

  /* listener-ok: page-lifetime by design -- Back/Forward to a #hash, installed once with the click listener above */
  addEventListener('hashchange', function () {
    var n = id(location.hash), t = el(n);

    if (t) { settle(t); aim(t); }
  });

  var n0 = id(location.hash);   /* read now: the router may normalise the URL once it mounts */
  if (n0) {
    arm();   /* from the first layout on, cards render for real */
    timer = setTimeout(release, 15000);   /* a stray hash with no element: do not hold forever */
    var go = function () { var t = el(n0); if (!t) return false; settle(t); aim(t); return true; };
    var start = function () {

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

})();
