[package]
name = "attr-spread-collision-checker"
version = "0.1.0"
edition = "2021"
publish = false
description = "syn-based analyzers: the attr-spread-collision-checker behind scripts/check-attr-spread-collision.sh and the public-api-snapshot behind scripts/check-public-api.sh -- see those scripts' headers."

[[bin]]
name = "attr-spread-collision-checker"
path = "src/main.rs"

[dependencies]
# Same pin as the rest of the workspace (root Cargo.toml's [workspace.dependencies]) --
# resolves to the exact dioxus-rsx 0.7.9 already in Cargo.lock, i.e. the real grammar
# this repo's own `rsx! { .. }` invocations are written against.
dioxus-rsx = { workspace = true }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }

[lints]
workspace = true
