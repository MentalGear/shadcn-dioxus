name: Stylelint Checks

# Automatic triggers disabled until further notice (2026-08-30).
# To reactivate, delete the 'on: workflow_dispatch' line and uncomment:
# on:
#   push:
#     branches:
#       - main
#     paths:
#       - /**
#       - preview/**/*.css
#       - preview/**/*.rs
#       - preview/**/Cargo.toml
#       - primitives/**/*.rs
#       - primitives/**/Cargo.toml
#       - .github/**
#       - Cargo.toml
#
#   pull_request:
#     types: [opened, synchronize, reopened, ready_for_review]
#     branches:
#       - main
#     paths:
#       - /**
#       - preview/**/*.css
#       - preview/**/*.rs
#       - preview/**/Cargo.toml
#       - primitives/**/*.rs
#       - primitives/**/Cargo.toml
#       - .github/**
#       - Cargo.toml
#
on: workflow_dispatch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stylelint:
    if: github.event.pull_request.draft == false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      # Do our best to cache the toolchain and node install steps
      - uses: actions/checkout@v4
      # pnpm version comes from preview/package.json "packageManager" (row 359)
      - uses: pnpm/action-setup@v4.1.0
        with:
          package_json_file: preview/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: preview/pnpm-lock.yaml
      - name: Install dependencies
        run: cd ./preview && pnpm install --frozen-lockfile
      - name: Stylelint
        run: cd ./preview && pnpm exec stylelint "src/**/*.css" "assets/**/*.css" --max-warnings=0
