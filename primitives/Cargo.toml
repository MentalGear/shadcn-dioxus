[package]
name = "dioxus-primitives"
version = "0.0.1"
edition = "2021"
rust-version = "1.81.0"
readme = "../README.md"
keywords = ["gui", "dioxus", "components", "primitives"]
categories = ["gui", "wasm"]
authors = ["Dioxus Labs", "DogeDark"]
license = "MIT OR Apache-2.0"
homepage = "https://dioxuslabs.com"
repository = "https://github.com/DioxusLabs/components"

[dependencies]
dioxus = { workspace = true, features = ["lib", "launch"] }
dioxus-attributes = { path = "../dioxus-attributes" }
# The pure `decide` of each named behaviour (row 509): called directly on a renderer with no page, and built for
# `wasm32-unknown-unknown` into the committed module the bridge loads into a page. No dependencies of its own.
decision-kernel = { path = "../decision-kernel" }
# Optional, switched on by the `calendar` feature (Calendar, DatePicker): see `[features]`.
time = { version = "0.3.47", optional = true, features = ["std", "local-offset"] }
tracing.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
# The bridge's JSON (`src/bridge/`): messages to and from `document::eval` are `serde_json` values; dioxus already depends on it.
serde_json = "1.0.149"
# Optional, switched on by the `color-picker` feature (ColorPicker).
palette = { version = "0.7.6", optional = true, default-features = false, features = ["std"] }

# `src/sleep.rs`, the one timer: tokio on native, gloo-timers on wasm (what `dioxus-sdk-time::sleep` was).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.52.3", features = ["time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
gloo-timers = { version = "0.3.0", features = ["futures"] }
# The wasm build of `time` reads the clock through `wasm-bindgen` (`UtcDateTime::now()` in the calendar); a host build never does.
time = { version = "0.3.47", optional = true, features = ["wasm-bindgen"] }

[dev-dependencies]
dioxus-ssr = "0.7.0"
# The calendar and date-picker tests write dates with `time::macros::date!`; the library itself does not.
time = { version = "0.3.47", features = ["macros"] }
# `interval.rs` tests drive a VirtualDom on tokio's paused clock (tokio is a native dependency of `src/sleep.rs`).
tokio = { version = "1.52.3", features = ["rt", "macros", "time", "test-util"] }

# A component pays only for the crates it uses: `dx components add <name>` runs `cargo add dioxus-primitives
# --features <the component.json features>`, so an app without a colour picker never compiles `palette` (and
# its 11 companions) and one without a calendar never compiles `time`. `scripts/check-primitives-features.sh`
# proves every subset below builds on its own (the workspace build unifies them all).
#
# The primitives render for a browser engine (a browser, or a desktop or mobile webview) by default and need no
# feature for it. `native` selects the Blitz arm (no JavaScript); it also turns on `dioxus/native`, and a
# compile-time assert in `src/lib.rs` holds it equal to the renderer dioxus itself is built for.
[features]
default = ["router"]
router = ["dioxus/router"]
native = ["dioxus/native"]
# Inert: nothing reads it. Manifests that still forward `dioxus-primitives/web` keep compiling.
web = []
# `calendar` and `date_picker` (they use each other's types).
calendar = ["dep:time"]
# `color_picker`.
color-picker = ["dep:palette"]

# docs.rs documents the browser arm.
[package.metadata.docs.rs]
features = ["router", "calendar", "color-picker"]

[lints]
workspace = true
