[package]
name = "decision-kernel"
version = "0.0.1"
edition = "2021"
rust-version = "1.81.0"
description = "The pure Rust decide of each named behaviour, callable natively and exported to the page as a wasm module."
license = "MIT OR Apache-2.0"
publish = false

# No dependencies, by design: the module is small, its bytes are reproducible, and the same functions run
# natively on a renderer that has no page.
[dependencies]

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
