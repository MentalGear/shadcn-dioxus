# The float contract of the decision kernel (row 509): the same decision on every renderer. These methods are
# transcendental, so they come from Rust's bundled libm on wasm32 and from the system libm natively: a threshold could
# flip by one ulp between the page and Blitz. Arithmetic, `sqrt`, `abs`, `floor`, `ceil`, `round`, `trunc`, `min`, `max`
# and comparisons are IEEE-exact on both and stay allowed. This file is read for this crate only (clippy takes the
# nearest `clippy.toml`), so the repository's sink ban list in the root `clippy.toml` is not in force here and the crate
# has no sink to ban: it has no dependency on dioxus.
disallowed-methods = [
  { path = "f64::exp", reason = "row 509: transcendental, libm differs between wasm32 and the host" },
  { path = "f64::exp2", reason = "row 509: transcendental, libm differs between wasm32 and the host" },
  { path = "f64::exp_m1", reason = "row 509: transcendental, libm differs between wasm32 and the host" },
  { path = "f64::ln", reason = "row 509: transcendental, libm differs between wasm32 and the host" },
  { path = "f64::ln_1p", reason = "row 509: transcendental, libm differs between wasm32 and the host" },
